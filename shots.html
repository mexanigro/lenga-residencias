<!doctype html>
<!-- Vistas limpias para usar como referencia al generar renders (no es parte del sitio)
     ?plan=L3        plano de una tipología
     ?plate=lago     planta de un piso tipo (bosque, lago, cumbre, ph)
     sin parámetros  maqueta 3D blanca de la torre -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lenga — vistas de referencia</title>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/plan.css">
  <style>
    html, body { margin: 0; height: 100%; background: #F4F2EE; overflow: hidden; }
    canvas, svg { display: block; width: 100vw; height: 100vh; }
    .ref .slab { fill: #E9E6E0; stroke: #222; stroke-width: .12; }
    .ref .deck { fill: #D9C9AE; }
    .ref .glass { fill: #F7F5F1; stroke: #222; stroke-width: .08; }
    .ref .unit { fill: #F7F5F1; stroke: #111; stroke-width: .32; }
    .ref .core { fill: #9A9A96; stroke: #111; stroke-width: .3; }
  </style>
  <script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js" } }</script>
</head>
<body>
  <script type="module">
    import { TYPES, FLOORS, CORE } from './js/data.js';
    import { drawPlan } from './js/plan.js';
    const q = new URLSearchParams(location.search);
    const NS = 'http://www.w3.org/2000/svg';
    const el = (t, a, p) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); p.appendChild(e); return e; };
    if (q.has('plan')) {
      const svg = el('svg', {}, document.body);
      drawPlan(svg, TYPES[q.get('plan')], { areas: false });
    } else if (q.has('plate')) {
      // planta de piso vista desde arriba, sin rotar: losa, balcón perimetral, núcleo y unidades
      const f = FLOORS.find((x) => x.zone === q.get('plate'));
      const svg = el('svg', { viewBox: '-16 -16 32 32', class: 'ref' }, document.body);
      el('rect', { x: -13, y: -13, width: 26, height: 26, rx: 3.2, class: 'slab deck' }, svg);
      el('rect', { x: -11.9, y: -11.9, width: 23.8, height: 23.8, rx: 1.9, class: 'glass' }, svg);
      for (const u of f.units) el('path', { d: `M${u.poly.map((p) => p.join(' ')).join('L')}Z`, class: 'unit' }, svg);
      el('path', { d: `M${CORE.map((p) => p.join(' ')).join('L')}Z`, class: 'core' }, svg);
    } else {
      const { createScene } = await import('./js/scene.js');
      const c = el('canvas', {}, document.body);
      createScene(c, { shot: true });
    }
  </script>
</body>
</html>
